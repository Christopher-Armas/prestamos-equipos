name: Integracion continua

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: target/surefire-reports/

  entrega-continua:
    needs: compilar-y-probar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Empaquetar la aplicacion
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package

      - name: Publicar el jar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: prestamos-equipos-jar
          path: target/prestamos-equipos-*.jar
          if-no-files-found: error
